<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唐詩星圖 · 五萬七千首詩的夜空</title>
<meta name="description" content="《全唐诗》57,215 首，每首投影为一颗星。意象相近的诗彼此靠近，聚成星团。检索、漫游、盖星印、连星成座。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23060a14'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e8e4d8'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23d4b06a' stroke-opacity='.5'/%3E%3Ccircle cx='26' cy='7' r='1' fill='%23e8e4d8'/%3E%3Ccircle cx='6' cy='24' r='1.2' fill='%23e8e4d8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="sky" aria-label="唐詩星圖星空"></canvas>
<div id="labels" aria-hidden="true"></div>

<!-- 开场 -->
<div id="intro">
  <div class="intro-inner">
    <h1 class="intro-title">唐詩星圖</h1>
    <p class="intro-sub">五萬七千餘首唐詩 · 三千六百餘位詩人 · 皆化作星辰</p>
    <button id="introBtn" class="intro-btn">入 夜</button>
  </div>
</div>

<!-- 左上控制面板 -->
<section id="panel" aria-label="检索与过滤">
  <button id="panelToggle" class="icon-btn" aria-label="收合面板">▾</button>
  <div class="panel-search">
    <input id="search" type="search" placeholder="檢索題名、詩人、詩句…" autocomplete="off" spellcheck="false">
    <div id="searchResults" role="listbox" aria-label="檢索結果"></div>
  </div>
  <div class="panel-filters">
    <div class="panel-hint">意象過濾 · 選中後只見其星</div>
    <div id="dimChips"></div>
  </div>
  <div id="stats">載入星表…</div>
</section>

<!-- 左下图例 -->
<div id="legend" aria-hidden="true"></div>

<!-- 顶部模式条 -->
<nav id="modeBar" aria-label="模式">
  <button id="todayStar" class="mode-gold" title="今夜主星">今夜…</button>
  <span class="mode-sep"></span>
  <button id="modeConst">連星成座</button>
  <button id="modeStamps">星印 <span id="stampCount">0</span></button>
  <span class="mode-sep"></span>
  <button id="btnResetView">復位</button>
</nav>

<!-- 诗文卷轴 -->
<aside id="reader" aria-label="詩文">
  <button id="readerClose" class="icon-btn" aria-label="關閉">×</button>
  <div id="rTitle"></div>
  <div id="rAuthor"></div>
  <div id="rNote" class="hidden"></div>
  <div id="rBody"></div>
  <div id="rDims"></div>
  <div id="rNeighbors">
    <div class="nb-hint">比鄰之星</div>
    <div id="nbList"></div>
  </div>
  <div class="reader-actions">
    <button id="actStamp" class="btn">蓋星印</button>
    <button id="actLink" class="btn">入星座</button>
    <button id="actShare" class="btn">分享此星</button>
  </div>
</aside>

<!-- 连星面板 -->
<section id="constPanel" class="hidden" aria-label="連星成座">
  <h2>連星成座</h2>
  <p class="const-hint">在星空中點選至多七顆星，連成你自己的星座。</p>
  <input id="constName" placeholder="為星座命名…" maxlength="12" autocomplete="off">
  <div id="constList"></div>
  <div class="const-actions">
    <button id="constShare" class="btn btn-gold">生成星圖</button>
    <button id="constClear" class="btn">解散</button>
  </div>
</section>

<!-- 分享浮层 -->
<div id="shareBox" class="hidden" role="dialog" aria-modal="true" aria-label="分享">
  <div class="share-inner">
    <h3>星圖鏈接</h3>
    <input id="shareUrl" readonly>
    <div class="share-actions">
      <button id="shareCopy" class="btn btn-gold">複製鏈接</button>
      <button id="shareClose" class="btn">關閉</button>
    </div>
  </div>
</div>

<div id="toast" aria-live="polite"></div>

<footer id="footer">詩文數據 · chinese-poetry 開放數據集 · 布局：landmark-MDS 意象投影</footer>

<script src="js/gl.js"></script>
<script src="js/app.js"></script>
</body>
</html>
